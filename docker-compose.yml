# Postgres de développement ; l'API tourne sur la machine (make dev).
name: facturation-api

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: sandbox
      POSTGRES_DB: sandbox
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sandbox -d sandbox']
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
